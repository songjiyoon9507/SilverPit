spring.application.name=SilverFitterPan

# =========================================================================
#  공통 설정 (모든 환경)
#  환경별 설정은 프로필 파일로 분리
#   - application-local.properties : 로컬(Windows) - HTTP 80
#   - application-prod.properties  : 운영(Linux 서버) - HTTPS 443
#  실행 시 프로필 지정
#   - 로컬 : run.bat / VS Code  -> --spring.profiles.active=local
#   - 운영 : run.sh             -> --spring.profiles.active=prod
#  * 프로필을 지정하지 않고 실행하면 local 로 동작
# =========================================================================
spring.profiles.default=local

# ------------------------- 타임리프 -------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------- 세션 -------------------------
# 세션 아이디(JSESSIONID)를 URL이 아닌 쿠키로만 관리
server.servlet.session.tracking-modes=cookie
