# =========================================================================
#  로컬(Windows) 프로필 - spring.profiles.active=local
#  * run.bat, VS Code 에서 실행할 때 사용 (SSL 없이 HTTP)
# =========================================================================

# ------------------------- 서버 -------------------------
server.port=80
server.address=0.0.0.0

# ------------------------- 화면/개발 편의 (캐시 off, devtools on) -------------------------
spring.thymeleaf.cache=false
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true

# ------------------------- 로깅 레벨 (trace < debug < info < warn < error) -------------------------
logging.level.com.silverfitterpan.mobileweb=debug

# ------------------------- 로그 파일 (logback-spring.xml 에서 사용) -------------------------
# 로그 파일 저장 경로 (끝에 / 필요)
log.config.path=C:/log/
# 로그 파일 이름 (오늘치 활성 파일: silver.log)
log.config.fileName=silver
